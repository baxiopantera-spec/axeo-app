<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AXEO App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090b0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }

    .header {
      margin-bottom: 28px;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .subtitle {
      color: #858b98;
      margin-top: 5px;
      font-size: 14px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    .card {
      width: 100%;
      background: #12151b;
      border: 1px solid #20242d;
      border-radius: 18px;
      padding: 20px;
      color: white;
      text-align: left;
      cursor: pointer;
      transition: 0.15s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .icon {
      font-size: 27px;
      margin-bottom: 13px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
    }

    .card-description {
      color: #858b98;
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .back {
      display: inline-block;
      color: #9cbcff;
      font-size: 14px;
      margin-bottom: 22px;
      cursor: pointer;
    }

    .bank {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bank-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #1b2029;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .empty {
      background: #12151b;
      border: 1px solid #20242d;
